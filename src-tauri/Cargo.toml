[package]
name = "modctl"
version = "0.1.0"
description = "3DMigoto and XXMI mod manager, INI effect installer, and keybind fixer"
authors = ["Caya8205"]
edition = "2021"

[lib]
name = "modctl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
