name: Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - package.json
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.release.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Check existing release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          if gh release view "v$version" --json tagName > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release v$version already exists."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release v$version not found."
          fi

  build-windows:
    needs: preflight
    if: needs.preflight.outputs.exists == 'false'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Sync versions
        run: npm run version:sync

      - name: Build AIOMM (Windows)
        run: npm run tauri:build

      - name: Prepare Release Assets
        shell: bash
        run: |
          mkdir -p release-assets
          version="${{ needs.preflight.outputs.version }}"
          cp src-tauri/target/release/aiomm.exe release-assets/AIOMM.exe
          cd release-assets
          powershell -NoProfile -Command "Compress-Archive -Path 'AIOMM.exe' -DestinationPath 'AIOMM-v${version}-windows-x64.zip' -Force"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: release-assets/*
          retention-days: 1

  release:
    needs: [preflight, build-windows]
    if: needs.preflight.outputs.exists == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-assets
          path: dist-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.preflight.outputs.version }}
          name: v${{ needs.preflight.outputs.version }}
          generate_release_notes: true
          files: |
            dist-release/*
